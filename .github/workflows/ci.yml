name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          node --check mcp_stdio_server.mjs
          node --check public/office_thread.js
          node --check lowa/node-runtime.mjs
          node --check lowa/node-host.mjs
          node --check lowa/prepare-cdn.mjs
          node --check test_client.mjs
