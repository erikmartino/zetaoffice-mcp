name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          node --check mcp_stdio_server.mjs
          node --check public/office_thread.js
          node --check lowa/node-runtime.mjs
          node --check lowa/node-host.mjs
          node --check lowa/prepare-cdn.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile test_client.py python/uno.py python/unohelper.py
